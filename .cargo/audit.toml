# cargo-audit configuration. Vulnerabilities always fail; unsound/unmaintained
# are reported as warnings.
[advisories]
ignore = [
    # rsa Marvin attack, through adb_client 2.1.19: no fixed rsa release yet (0.10 is a
    # release candidate). adb_client signs the ADB auth token locally, so the timing
    # side channel needs a local attacker measuring that signature.
    "RUSTSEC-2023-0071",
]
