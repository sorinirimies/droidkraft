[package]
name = "droidkraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DroidKraft — Android device monitor GUI: live logs, one-click commands, flash/root toolkit, and screen mirroring (Zed GPUI)"
documentation = "https://docs.rs/droidkraft"
readme = "README.md"
categories = ["gui", "development-tools"]
keywords = ["android", "adb", "gui", "gpui", "logcat"]

[[bin]]
name = "droidkraft"
path = "src/main.rs"

[lib]
name = "droidkraft_gui"
path = "src/lib.rs"

[dependencies]
droidkraft-core = { workspace = true }
droidkraft-mirror = { workspace = true }
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Pin only: xattr 0.2.3 (gpui → zed-async-tar) reads libc::ENOATTR, which libc 0.2.190
# dropped on Linux. Remove once gpui no longer pulls xattr 0.2.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[package.metadata.cargo-machete]
ignored = ["libc"]

# ── Packaging metadata ────────────────────────────────────────────────────────
# `cargo binstall droidkraft` downloads the prebuilt Linux or macOS archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints]
workspace = true
