[package]
name = "droidkraft-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A beautiful Terminal User Interface (TUI) for Android development and ADB commands"
documentation = "https://docs.rs/droidkraft-tui"
keywords = ["android", "adb", "tui", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "droidkraft_tui"
path = "src/lib.rs"

[[bin]]
name = "droidkraft-tui"
path = "src/main.rs"

[dependencies]
droidkraft-core   = { workspace = true }
droidkraft-mirror = { workspace = true }
droidkraft-fastboot = { workspace = true }

crossterm         = { workspace = true }
unicode-width     = "0.2"
ratatui           = { workspace = true }
ratatui-image     = { workspace = true }
tokio             = { workspace = true }
color-eyre        = { workspace = true }
tui-file-explorer = { workspace = true }
tui-nuances       = { workspace = true }
tui-chart         = { workspace = true }
tui-piechart      = { workspace = true }
tui-spinner       = { workspace = true }
tui-checkbox      = { workspace = true }
serde_json        = { workspace = true }
adb_client        = { workspace = true }
image             = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# ── Packaging metadata ────────────────────────────────────────────────────────
# `cargo binstall droidkraft-tui` downloads the prebuilt release tarball.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true
