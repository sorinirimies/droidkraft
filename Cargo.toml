[workspace]
members = [
    "crates/droidkraft-fastboot",
    "crates/droidkraft-mirror",
    "crates/droidkraft-core",
    "crates/droidkraft-tui",
    "crates/droidkraft-gui",
]
# The GUI depends on Zed's gpui, which requires the full Xcode Metal toolchain
# (macOS) to build. Keep it out of the default set so `cargo build`/`cargo test`
# stay green on machines without it; build it explicitly with `-p droidkraft`.
default-members = [
    "crates/droidkraft-mirror",
    "crates/droidkraft-fastboot",
    "crates/droidkraft-core",
    "crates/droidkraft-tui",
]
resolver = "2"

[workspace.package]
version      = "2.1.8"
edition    = "2021"
authors    = ["Sorin Albu-Irimies <mihaiirimies@gmail.com>"]
license    = "MIT"
repository = "https://github.com/sorinirimies/droidkraft"
homepage   = "https://github.com/sorinirimies/droidkraft"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here once; each crate references them with `{ workspace = true }`
# so there is a single source of truth.
[workspace.dependencies]
# Core / shared (framework-free)
adb_client  = "2.1.17"
regex       = "1"
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.149"
ureq        = { version = "2.10", features = ["json"] }
sha2        = "0.10"
zip         = { version = "2.2", default-features = false, features = ["deflate"] }

# Async / runtime
tokio    = { version = "1.40.0", features = ["full"] }
futures  = "0.3.32"

# Errors
color-eyre = "0.6.3"

# TUI (Ratatui 0.30 ecosystem)
crossterm         = { version = "0.29", features = ["event-stream"] }
ratatui           = "0.30"
tui-file-explorer = { version = "3", default-features = false }
tui-nuances       = "0.1.6"
tui-chart         = "0.1.1"
tui-piechart      = "1.1"
tui-spinner       = "0.5"
tui-slider        = "0.4"
tui-checkbox      = "0.5"
ratatui-image     = { version = "12.0.0-rc.2", default-features = false, features = ["crossterm"] }

# Internal crates
droidkraft-core = { path = "crates/droidkraft-core", version = "2.1.8" }
droidkraft-mirror = { path = "crates/droidkraft-mirror", version = "2.1.8" }
droidkraft-fastboot = { path = "crates/droidkraft-fastboot", version = "2.1.8" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

# Debug builds of the GUI decode video in real time; unoptimised deps
# (image/jpeg, gpui) make the mirror crawl, so optimise them even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.droidkraft]
opt-level = 2