name: Packages

# Linux-only CI: AppImage, Flatpak, deb, rpm, tarballs (x86_64 + aarch64) and a
# cross-compiled Windows TUI zip (cargo-xwin). Attached to the GitHub release;
# files of older releases are removed. (No macOS/Windows runners are used.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure release exists
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes

  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with: { version: "0.116.1" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang pkg-config libfontconfig-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libvulkan-dev libasound2-dev libssl-dev libdrm-dev libgbm-dev libudev-dev \
            flatpak flatpak-builder desktop-file-utils
      - name: Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deb,cargo-generate-rpm" }
      - name: Install zig (zvm, direct-download fallback)
        run: |
          Z=0.15.2
          if curl -fsSL --retry 5 https://www.zvm.app/install.sh | bash && PATH="$HOME/.zvm/bin:$HOME/.zvm/self:$PATH" zvm install "$Z"; then
            echo "$HOME/.zvm/bin" >> "$GITHUB_PATH"
            echo "$HOME/.zvm/self" >> "$GITHUB_PATH"
          else
            echo "::warning::zvm failed, downloading zig from ziglang.org"
            curl -fsSL --retry 5 "https://ziglang.org/download/$Z/zig-x86_64-linux-$Z.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/zig-x86_64-linux-$Z" >> "$GITHUB_PATH"
          fi
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-zigbuild }
      - run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m755 appimagetool /usr/local/bin/appimagetool
      - name: Build
        run: cargo build --release -p droidkraft -p droidkraft-tui
      - name: aarch64 TUI cross-build (zig, glibc 2.17)
        # x86_64 uses the native build above. zigbuild on a same-arch target mis-passes the .2.17 suffix to cc-rs.
        env:
          LIBUDEV_NO_PKG_CONFIG: "1"
        run: cargo zigbuild --release -p droidkraft-tui --target aarch64-unknown-linux-gnu.2.17
      - name: Static musl TUI builds (Alpine, any distro)
        env:
          LIBUDEV_NO_PKG_CONFIG: "1"
        run: |
          cargo zigbuild --release -p droidkraft-tui --target x86_64-unknown-linux-musl
          cargo zigbuild --release -p droidkraft-tui --target aarch64-unknown-linux-musl
      - name: Package
        run: |
          V="${TAG#v}"
          nu scripts/ci/package_tarball.nu "$V" x86_64-unknown-linux-musl
          nu scripts/ci/package_tarball.nu "$V" aarch64-unknown-linux-musl
          nu scripts/ci/package_appimage.nu "$V"
          nu scripts/ci/package_flatpak.nu "$V"
          nu scripts/ci/package_flatpak.nu "$V" --tui
          nu scripts/ci/package_snap.nu "$V"
          nu scripts/ci/package_snap.nu "$V" --tui
          nu scripts/ci/package_tarball.nu "$V" x86_64-unknown-linux-gnu
          nu scripts/ci/package_tarball.nu "$V" x86_64-unknown-linux-gnu --gui
          nu scripts/ci/package_tarball.nu "$V" aarch64-unknown-linux-gnu
          cargo deb -p droidkraft-tui --no-build -o dist/
          cargo generate-rpm -p crates/droidkraft-tui -o dist/
          cargo deb -p droidkraft-tui --no-build --target aarch64-unknown-linux-gnu -o dist/
          cargo generate-rpm -p crates/droidkraft-tui --target aarch64-unknown-linux-gnu -o dist/
          cargo deb -p droidkraft --no-build -o dist/
          cargo generate-rpm -p crates/droidkraft-gui -o dist/
      - uses: snapcore/action-build@v1
        id: snap-gui
        with: { path: snapbuild-gui }
      - uses: snapcore/action-build@v1
        id: snap-tui
        with: { path: snapbuild-tui }
      - run: |
          cp "${{ steps.snap-gui.outputs.snap }}" "dist/droidkraft_${TAG#v}_amd64.snap"
          cp "${{ steps.snap-tui.outputs.snap }}" "dist/droidkraft-tui_${TAG#v}_amd64.snap"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.flatpak
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.snap

  windows:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with: { version: "0.116.1" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm zip
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-xwin }
      - run: sudo apt-get install -y --no-install-recommends nsis nsis-pluginapi
      - run: cargo xwin build --release --target x86_64-pc-windows-msvc -p droidkraft-tui
      - run: nu scripts/ci/package_tarball.nu "${TAG#v}" x86_64-pc-windows-msvc
      - run: nu scripts/ci/package_windows.nu "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  # macOS TUI cross-compiled from Linux (zig + Apple SDK). Best-effort: a failure does not block the release.
  macos:
    needs: release
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with: { version: "0.116.1" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (zvm, direct-download fallback)
        run: |
          Z=0.15.2
          if curl -fsSL --retry 5 https://www.zvm.app/install.sh | bash && PATH="$HOME/.zvm/bin:$HOME/.zvm/self:$PATH" zvm install "$Z"; then
            echo "$HOME/.zvm/bin" >> "$GITHUB_PATH"
            echo "$HOME/.zvm/self" >> "$GITHUB_PATH"
          else
            echo "::warning::zvm failed, downloading zig from ziglang.org"
            curl -fsSL --retry 5 "https://ziglang.org/download/$Z/zig-x86_64-linux-$Z.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/zig-x86_64-linux-$Z" >> "$GITHUB_PATH"
          fi
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-zigbuild }
      - name: macOS SDK
        run: |
          curl -fsSL --retry 5 https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "SDKROOT=$RUNNER_TEMP/MacOSX14.5.sdk" >> "$GITHUB_ENV"
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo zigbuild --release -p droidkraft-tui --target aarch64-apple-darwin
          cargo zigbuild --release -p droidkraft-tui --target x86_64-apple-darwin
      - run: |
          V="${TAG#v}"
          nu scripts/ci/package_tarball.nu "$V" aarch64-apple-darwin
          nu scripts/ci/package_tarball.nu "$V" x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz

  publish:
    needs: [linux, windows, macos]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with: { version: "0.116.1" }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Upload to release and prune old versions
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          ls -l dist
          V="${TAG#v}"
          nu scripts/ci/render_packaging.nu "$V"
          gh release upload "$TAG" dist/* --clobber
          nu scripts/ci/prune_releases.nu "$TAG"
      # Native distro packages built from the rendered manifests (sources are the release assets uploaded above).
      - name: Arch .pkg.tar.zst
        continue-on-error: true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          for p in droidkraft-tui-bin droidkraft-bin; do
            mkdir -p "arch/$p" && cp "dist/PKGBUILD-$p" "arch/$p/PKGBUILD"
            docker run --rm -v "$PWD/arch/$p:/pkg" archlinux:latest bash -c \
              "pacman -Syu --noconfirm base-devel >/dev/null && useradd -m b && chown -R b /pkg && su b -c 'cd /pkg && makepkg -f --noconfirm --nodeps'"
            gh release upload "$TAG" arch/$p/*.pkg.tar.zst --clobber
          done
      - uses: docker/setup-qemu-action@v3
      - name: Alpine .apk (x86_64 + aarch64)
        continue-on-error: true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          for plat in amd64:x86_64 arm64:aarch64; do
            P="${plat%%:*}"; A="${plat##*:}"
            mkdir -p "alpine-$A" && cp dist/APKBUILD "alpine-$A/APKBUILD"
            docker run --rm --platform "linux/$P" -v "$PWD/alpine-$A:/w" alpine:3.20 sh -c \
              "apk add --no-cache alpine-sdk >/dev/null && adduser -D b && addgroup b abuild && chown -R b /w && su b -c 'abuild-keygen -a -n && cd /w && abuild checksum && abuild -r' && cp /home/b/packages/w/$A/*.apk /w/"
            for f in alpine-$A/*.apk; do mv "$f" "${f%.apk}-$A.apk"; done
            gh release upload "$TAG" alpine-$A/*-$A.apk --clobber
          done
