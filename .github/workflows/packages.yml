name: Packages

# Linux-only CI: AppImage, Flatpak, deb, rpm, tarballs (x86_64 + aarch64) and a
# cross-compiled Windows TUI zip (cargo-xwin). Attached to the GitHub release;
# files of older releases are removed. (No macOS/Windows runners are used.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure release exists
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes

  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with: { version: "0.116.1" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang pkg-config libfontconfig-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libvulkan-dev libasound2-dev libssl-dev libdrm-dev libgbm-dev libudev-dev \
            flatpak flatpak-builder desktop-file-utils
      - name: Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deb,cargo-generate-rpm" }
      - uses: mlugg/setup-zig@v1
        with: { version: 0.14.1 }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-zigbuild }
      - run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m755 appimagetool /usr/local/bin/appimagetool
      - name: Build
        run: cargo build --release -p droidkraft -p droidkraft-tui
      - name: Portable TUI builds (glibc 2.17, x86_64 + aarch64)
        run: |
          cargo zigbuild --release -p droidkraft-tui --target x86_64-unknown-linux-gnu.2.17
          cargo zigbuild --release -p droidkraft-tui --target aarch64-unknown-linux-gnu.2.17
      - name: Package
        run: |
          V="${TAG#v}"
          nu scripts/ci/package_appimage.nu "$V"
          nu scripts/ci/package_flatpak.nu "$V"
          nu scripts/ci/package_tarball.nu "$V" x86_64-unknown-linux-gnu
          nu scripts/ci/package_tarball.nu "$V" x86_64-unknown-linux-gnu --gui
          nu scripts/ci/package_tarball.nu "$V" aarch64-unknown-linux-gnu
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo deb -p droidkraft-tui --no-build --target $t -o dist/
            cargo generate-rpm -p crates/droidkraft-tui --target $t -o dist/
          done
          cargo deb -p droidkraft --no-build -o dist/
          cargo generate-rpm -p crates/droidkraft -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.flatpak
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  windows:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with: { version: "0.116.1" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm zip
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-xwin }
      - run: cargo xwin build --release --target x86_64-pc-windows-msvc -p droidkraft-tui
      - run: nu scripts/ci/package_tarball.nu "${TAG#v}" x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with: { version: "0.116.1" }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Upload to release and prune old versions
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          ls -l dist
          V="${TAG#v}"
          nu scripts/ci/render_packaging.nu "$V"
          gh release upload "$TAG" dist/* --clobber
          nu scripts/ci/prune_releases.nu "$TAG"
