name: Dependency update

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Update Cargo.lock
        run: cargo update
      - name: Verify (default members)
        run: |
          cargo check --locked --all-targets
          cargo test --locked
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet Cargo.lock && { echo "No updates"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          b="chore/deps-$(date +%Y%m%d)"
          git checkout -b "$b"
          git commit -am "chore: update dependencies"
          git push origin "$b"
          PR_URL=$(gh pr create --title "chore: update dependencies" --body "Automated \`cargo update\`. Lockfile only: merged without a version bump." --base "${GITHUB_REF_NAME}")
          # Checks already passed above (check + tests on the updated lockfile): merge it.
          gh pr merge "$PR_URL" --merge --delete-branch 2>/dev/null \
            || gh pr merge "$PR_URL" --auto --merge --delete-branch
